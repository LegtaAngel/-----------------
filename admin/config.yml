backend:
  name: github
  repo: LegtaAngel/-----------------
  branch: main
  base_url: https://mrmissmit.vercel.app
  auth_endpoint: api/auth

media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: wallpapers
    label: Товары
    files:
      - name: catalog
        label: Каталог товаров
        file: content/wallpapers.json
        format: json
        fields:
          - label: Товары
            name: products
            widget: list
            label_singular: Товар
            summary: "{{fields.model}} — {{fields.title}}"
            fields:
              - label: Название товара
                name: title
                widget: string
                required: false
              - label: Модель/Коллекция обоев
                name: model
                widget: string
                required: false
              - label: Номер дизайна
                name: design
                widget: string
                required: false
              - label: Цена в рублях
                name: price
                widget: number
                value_type: int
                min: 0
                required: false
              - label: Сколько в наличии
                name: stock
                widget: number
                value_type: int
                min: 0
                required: false
              - label: Фотографии товара
                name: images
                widget: list
                required: false
                label_singular: Фото
                field:
                  label: Фотография
                  name: image
                  widget: image
                  required: false
